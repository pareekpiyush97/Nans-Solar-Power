name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages on every push to main.
# The site works in demo mode with no config. To go LIVE, add two repo *Variables*
# (Settings → Secrets and variables → Actions → Variables) — these are public, safe values:
#   VITE_POCKETBASE_URL           e.g. https://your-pocketbase-host
#   VITE_GOOGLE_OAUTH_CLIENT_ID   e.g. xxxx.apps.googleusercontent.com
# (The Google client SECRET stays on Pocketbase — never put it here.)
#
# One-time: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_POCKETBASE_URL: ${{ vars.VITE_POCKETBASE_URL }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
